seed: 42
output_dir: outputs
device: cpu

data:
  train_path: data/synthetic/train.jsonl
  val_path: data/synthetic/val.jsonl
  test_path: data/synthetic/test.jsonl
  max_text_length: 192
  image_size: 224

model:
  text_encoder: distilbert-base-multilingual-cased
  vision_encoder: openai/clip-vit-base-patch32
  fusion: gated
  hidden_size: 128
  dropout: 0.2
  num_labels: 2
  use_vision: false
  use_context: true

train:
  epochs: 1
  batch_size: 4
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  grad_clip: 1.0
  log_every: 5

dpo:
  policy_model: google/flan-t5-small
  beta: 0.1
  epochs: 1
  batch_size: 2
  learning_rate: 5.0e-5
  max_source_length: 256
  max_target_length: 96

xai:
  methods: [lime, attention]
  lime_samples: 80
  ig_steps: 16
  top_k_tokens: 6

eval:
  metrics: [accuracy, f1_macro, f1_weighted, precision, recall, auroc]
  fairness_groups: [language, modality]
