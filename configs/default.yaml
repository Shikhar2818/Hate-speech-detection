seed: 42
output_dir: outputs
device: auto

data:
  train_path: data/synthetic/train.jsonl
  val_path: data/synthetic/val.jsonl
  test_path: data/synthetic/test.jsonl
  max_text_length: 256
  image_size: 224

model:
  text_encoder: xlm-roberta-base
  vision_encoder: openai/clip-vit-base-patch32
  fusion: gated
  hidden_size: 256
  dropout: 0.2
  num_labels: 2
  use_vision: false
  use_context: true

train:
  epochs: 3
  batch_size: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  grad_clip: 1.0
  log_every: 10

dpo:
  policy_model: google/flan-t5-small
  beta: 0.1
  epochs: 2
  batch_size: 4
  learning_rate: 5.0e-5
  max_source_length: 384
  max_target_length: 128

xai:
  methods: [lime, integrated_gradients, attention]
  lime_samples: 200
  ig_steps: 32
  top_k_tokens: 8

eval:
  metrics: [accuracy, f1_macro, f1_weighted, precision, recall, auroc]
  fairness_groups: [language, modality]
