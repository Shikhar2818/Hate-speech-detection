hatexplain:
  seed: 42
  sources:
    - &hatexplain
      kind: hatexplain
      root: data/raw/hatexplain
      files:
        dataset.json: dataset.json
        post_id_divisions.json: post_id_divisions.json
        LICENSE: LICENSE

multilingual:
  seed: 42
  sources:
    - *hatexplain
    - kind: hasoc2021
      language: en
      root: data/raw/hasoc2021/en
      files:
        train: train.csv
        test: test.csv
    - kind: hasoc2021
      language: hi
      root: data/raw/hasoc2021/hi
      files:
        train: train.csv
        test: test.csv

hateful-memes:
  seed: 42
  sources:
    - kind: hateful_memes
      root: data/raw/hateful_memes
      files:
        train: train.jsonl
        val: dev_unseen.jsonl
        test: test_unseen.jsonl

english-hinglish:
  seed: 42
  sources:
    - *hatexplain
    - kind: hifox
      language: hi-en
      root: data/raw/hifox
      files:
        train: Train_Task_A.csv
        val: Val_Task_A.csv
        test: Test_Task_A.csv

cadd:
  seed: 42
  sources:
    - kind: cadd
      root: data/raw/cadd
      files:
        train: CADD_train.json
        val: CADD_dev.json
        test: CADD_test.json
